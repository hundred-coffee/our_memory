<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快乐！ - 我的爱人</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-pink: #E8B4B8;
            --soft-pink: #F7E7E6;
            --cream-white: #FFF8F3;
            --deep-rose: #C85A6F;
            --gold: #D4AF37;
            --text-dark: #333333;
            --text-light: #666666;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--soft-pink), var(--cream-white));
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 导航栏样式 */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            font-weight: 700;
            color: var(--deep-rose);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-link:hover {
            color: var(--deep-rose);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--deep-rose);
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* 移动端菜单按钮 */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-dark);
            cursor: pointer;
        }

        /* 主要内容区域 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 2rem 2rem;
            min-height: 100vh;
        }

        /* 英雄区域 */
        .hero-section {
            text-align: center;
            padding: 4rem 0;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease 0.5s forwards;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            color: var(--deep-rose);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero-subtitle {
            font-size: 1.5rem;
            color: var(--text-light);
            margin-bottom: 2rem;
            font-weight: 300;
        }

        .birthday-date {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: var(--gold);
            margin-bottom: 3rem;
        }

        /* 功能按钮区域 */
        .features-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin: 4rem 0;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease 0.8s forwards;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 2.5rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .feature-icon {
            font-size: 3rem;
            color: var(--deep-rose);
            margin-bottom: 1.5rem;
        }

        .feature-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--deep-rose);
            margin-bottom: 1rem;
        }

        .feature-description {
            color: var(--text-light);
            line-height: 1.6;
        }

        /* 倒计时区域 */
        .countdown-section {
            background: rgba(255, 255, 255, 0.9);
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin: 4rem 0;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease 1.1s forwards;
        }

        .countdown-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--deep-rose);
            margin-bottom: 2rem;
        }

        .countdown-timer {
            display: flex;
            justify-content: center;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .countdown-item {
            text-align: center;
        }

        .countdown-number {
            font-size: 3rem;
            font-weight: 700;
            color: var(--deep-rose);
            display: block;
        }

        .countdown-label {
            font-size: 1rem;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 移动端导航菜单 */
        .mobile-nav {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100vh;
            background: white;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
            transition: right 0.3s ease;
            z-index: 999;
            padding: 2rem;
        }

        .mobile-nav.active {
            right: 0;
        }

        .mobile-nav-links {
            list-style: none;
            margin-top: 3rem;
        }

        .mobile-nav-link {
            display: block;
            padding: 1rem 0;
            text-decoration: none;
            color: var(--text-dark);
            font-size: 1.2rem;
            border-bottom: 1px solid #eee;
            transition: color 0.3s ease;
        }

        .mobile-nav-link:hover {
            color: var(--deep-rose);
        }

        .close-menu {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-dark);
        }

        /* 动画定义 */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .mobile-menu-btn {
                display: block;
            }

            .hero-title {
                font-size: 3rem;
            }

            .hero-subtitle {
                font-size: 1.2rem;
            }

            .birthday-date {
                font-size: 1.5rem;
            }

            .navbar {
                padding: 1rem;
            }

            .logo {
                font-size: 1.5rem;
            }

            .container {
                padding: 80px 1rem 1rem;
            }

            .features-section {
                grid-template-columns: 1fr;
            }

            .countdown-timer {
                gap: 1rem;
            }

            .countdown-number {
                font-size: 2rem;
            }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 2.5rem;
            }

            .feature-card {
                padding: 2rem;
            }

            .countdown-section {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <a href="index.html" class="logo">My Love</a>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-link">首页</a></li>
            <li><a href="memories.html" class="nav-link">回忆相册</a></li>
            <li><a href="messages.html" class="nav-link">爱情留言</a></li>
        </ul>
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
            <i class="fas fa-bars"></i>
        </button>
    </nav>

    <!-- 移动端导航菜单 -->
    <div class="mobile-nav" id="mobileNav">
        <button class="close-menu" onclick="toggleMobileMenu()">
            <i class="fas fa-times"></i>
        </button>
        <ul class="mobile-nav-links">
            <li><a href="index.html" class="mobile-nav-link" onclick="toggleMobileMenu()">首页</a></li>
            <li><a href="memories.html" class="mobile-nav-link" onclick="toggleMobileMenu()">回忆相册</a></li>
            <li><a href="messages.html" class="mobile-nav-link" onclick="toggleMobileMenu()">爱情留言</a></li>
        </ul>
    </div>

    <!-- 主要内容 -->
    <div class="container">
        <!-- 英雄区域 -->
        <section class="hero-section">
            <h1 class="hero-title">生日快乐，宝宝！</h1>
            <p class="hero-subtitle">在这个特别的日子里，我想把所有的爱和祝福都送给你</p>
            <div class="birthday-date">2025年11月8日</div>
        </section>

        <!-- 功能按钮区域 -->
        <section class="features-section">
            <a href="memories.html" class="feature-card">
                <div class="feature-icon">
                    <i class="fas fa-images"></i>
                </div>
                <h3 class="feature-title">回忆相册</h3>
                <p class="feature-description">重温我们共同的美好时光，每一张照片都记录着我们的爱情故事</p>
            </a>
            
            <a href="messages.html" class="feature-card">
                <div class="feature-icon">
                    <i class="fas fa-heart"></i>
                </div>
                <h3 class="feature-title">爱情留言</h3>
                <p class="feature-description">写下最真挚的祝福，让爱意在这个特别的日子里绽放</p>
            </a>
        </section>

        <!-- 倒计时区域 -->
        <section class="countdown-section">
            <h2 class="countdown-title">距离你的生日还有</h2>
            <div class="countdown-timer" id="countdownTimer">
                <div class="countdown-item">
                    <span class="countdown-number" id="days">00</span>
                    <span class="countdown-label">天</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="hours">00</span>
                    <span class="countdown-label">小时</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="minutes">00</span>
                    <span class="countdown-label">分钟</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="seconds">00</span>
                    <span class="countdown-label">秒</span>
                </div>
            </div>
        </section>
    </div>

    <script>
        // 移动端菜单切换
        function toggleMobileMenu() {
            const mobileNav = document.getElementById('mobileNav');
            mobileNav.classList.toggle('active');
        }

        // 点击导航链接时关闭移动菜单
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function() {
                const mobileNav = document.getElementById('mobileNav');
                mobileNav.classList.remove('active');
            });
        });

        // 生日倒计时
        function updateCountdown() {
            // 设置生日日期（2025年11月7日）
            const birthday = new Date('2025-11-08T00:00:00');
            const now = new Date();
            
            // 如果生日已经过去，计算下一年的生日
            if (now > birthday) {
                birthday.setFullYear(birthday.getFullYear() + 1);
            }
            
            const timeDiff = birthday - now;
            
            const days = Math.floor(timeDiff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeDiff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeDiff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeDiff % (1000 * 60)) / 1000);
            
            document.getElementById('days').textContent = days.toString().padStart(2, '0');
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
        }

        // 页面加载时初始化倒计时
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // 页面加载动画
        window.addEventListener('load', function() {
            setTimeout(() => {
                document.body.style.opacity = '1';
            }, 100);
        });
    </script>
</body>
</html>
