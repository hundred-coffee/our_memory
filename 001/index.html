<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生日快乐！我的爱人</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-pink: #E8B4B8;
            --soft-pink: #F7E7E6;
            --cream-white: #FFF8F3;
            --deep-rose: #C85A6F;
            --gold: #D4AF37;
            --text-dark: #333333;
            --text-light: #666666;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--soft-pink), var(--cream-white));
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 导航栏样式 */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            font-weight: 700;
            color: var(--deep-rose);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-link:hover {
            color: var(--deep-rose);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--deep-rose);
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* 移动端菜单按钮 */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-dark);
            cursor: pointer;
        }

        /* Hero 区域样式 */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, rgba(232, 180, 184, 0.1), rgba(247, 231, 230, 0.1));
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            max-width: 800px;
            padding: 2rem;
            z-index: 2;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 700;
            color: var(--deep-rose);
            margin-bottom: 1rem;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease 0.5s forwards;
        }

        .hero-subtitle {
            font-size: 1.5rem;
            color: var(--text-light);
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease 0.8s forwards;
        }

        .countdown {
            font-size: 1.2rem;
            color: var(--deep-rose);
            margin-bottom: 2rem;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease 1.1s forwards;
        }

        .cake-section {
            margin: 3rem 0;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease 1.4s forwards;
        }

        .cake-button {
            background: linear-gradient(135deg, var(--primary-pink), var(--deep-rose));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(200, 90, 111, 0.3);
        }

        .cake-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(200, 90, 111, 0.4);
        }

        .cake-image {
            width: 200px;
            height: 200px;
            margin: 2rem auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s ease;
        }

        .cake-image.active {
            opacity: 1;
            transform: scale(1);
        }

        .personal-message {
            background: rgba(255, 255, 255, 0.9);
            padding: 2rem;
            border-radius: 20px;
            margin: 2rem auto;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: none;
            opacity: 0;
            transform: translateY(20px);
        }

        .personal-message.active {
            display: block;
            animation: fadeInUp 0.8s ease forwards;
        }

        .message-text {
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem;
            color: var(--deep-rose);
            line-height: 1.4;
        }

        /* 移动端导航菜单 */
        .mobile-nav {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100vh;
            background: white;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
            transition: right 0.3s ease;
            z-index: 999;
            padding: 2rem;
        }

        .mobile-nav.active {
            right: 0;
        }

        .mobile-nav-links {
            list-style: none;
            margin-top: 3rem;
        }

        .mobile-nav-link {
            display: block;
            padding: 1rem 0;
            text-decoration: none;
            color: var(--text-dark);
            font-size: 1.2rem;
            border-bottom: 1px solid #eee;
            transition: color 0.3s ease;
        }

        .mobile-nav-link:hover {
            color: var(--deep-rose);
        }

        .close-menu {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-dark);
        }

        /* 动画定义 */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .mobile-menu-btn {
                display: block;
            }

            .hero-title {
                font-size: 2.5rem;
            }

            .hero-subtitle {
                font-size: 1.2rem;
            }

            .navbar {
                padding: 1rem;
            }

            .logo {
                font-size: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .hero-title {
                font-size: 2rem;
            }

            .hero-subtitle {
                font-size: 1rem;
            }

            .cake-button {
                padding: 0.8rem 1.5rem;
                font-size: 1rem;
            }

            .message-text {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <a href="index.html" class="logo">My Love</a>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-link">首页</a></li>
            <li><a href="memories.html" class="nav-link">回忆相册</a></li>
            <li><a href="messages.html" class="nav-link">爱情留言</a></li>
        </ul>
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
            <i class="fas fa-bars"></i>
        </button>
    </nav>

    <!-- 移动端导航菜单 -->
    <div class="mobile-nav" id="mobileNav">
        <button class="close-menu" onclick="toggleMobileMenu()">
            <i class="fas fa-times"></i>
        </button>
        <ul class="mobile-nav-links">
            <li><a href="index.html" class="mobile-nav-link" onclick="toggleMobileMenu()">首页</a></li>
            <li><a href="memories.html" class="mobile-nav-link" onclick="toggleMobileMenu()">回忆相册</a></li>
            <li><a href="messages.html" class="mobile-nav-link" onclick="toggleMobileMenu()">爱情留言</a></li>
        </ul>
    </div>

    <!-- Hero 区域 -->
    <section class="hero">
        <div class="hero-content">
            <h1 class="hero-title">生日快乐，我的爱人！</h1>
            <p class="hero-subtitle">在这个特别的日子里，我想给你最特别的惊喜</p>
            
            <div class="countdown" id="countdown">
                距离你的生日还有：计算中...
            </div>

            <div class="cake-section">
                <button class="cake-button" id="cakeButton">
                    <i class="fas fa-birthday-cake"></i> 点击点亮生日蛋糕
                </button>
                <div class="cake-image" id="birthdayCake">
                    <img src="birthday-cake.png" alt="生日蛋糕" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <div class="personal-message" id="personalMessage">
                    <p class="message-text">
                        亲爱的，生日快乐！<br>
                        愿你的每一天都充满阳光和欢笑，<br>
                        愿我们的爱情永远甜蜜如初。<br>
                        我爱你，直到永远！
                    </p>
                </div>
            </div>
        </div>
    </section>

    <!-- 引入动画库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    
    <script>
        // 移动端菜单切换
        function toggleMobileMenu() {
            const mobileNav = document.getElementById('mobileNav');
            mobileNav.classList.toggle('active');
        }

        // 生日倒计时计算
        function updateCountdown() {
            // 设置生日日期（示例：2024年12月25日）
            const birthday = new Date('2024-12-25');
            const now = new Date();
            
            // 如果生日已经过去，计算下一个生日
            if (now > birthday) {
                birthday.setFullYear(birthday.getFullYear() + 1);
            }
            
            const diff = birthday - now;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            
            document.getElementById('countdown').textContent = 
                `距离你的生日还有：${days}天 ${hours}小时 ${minutes}分钟 ${seconds}秒`;
        }

        // 初始化倒计时
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // 点击蛋糕按钮的动画效果
        document.getElementById('cakeButton').addEventListener('click', function() {
            const cake = document.getElementById('birthdayCake');
            const message = document.getElementById('personalMessage');
            
            // 显示蛋糕
            cake.classList.add('active');
            
            // 蛋糕动画
            anime({
                targets: cake,
                scale: [1, 1.2, 1],
                rotate: [0, -5, 5, 0],
                duration: 1000,
                easing: 'easeInOutQuad'
            });
            
            // 显示个人消息
            setTimeout(() => {
                message.classList.add('active');
                anime({
                    targets: message,
                    opacity: [0, 1],
                    translateY: [20, 0],
                    duration: 800,
                    easing: 'easeOutExpo'
                });
            }, 500);
        });

        // 点击导航链接时关闭移动菜单
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function() {
                const mobileNav = document.getElementById('mobileNav');
                mobileNav.classList.remove('active');
            });
        });

        // 页面加载动画
        window.addEventListener('load', function() {
            // 添加一些额外的加载后效果
            setTimeout(() => {
                document.body.style.opacity = '1';
            }, 100);
        });
    </script>
</body>
</html>
