<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>爱情留言板 - 生日快乐！</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500&family=Dancing+Script:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-pink: #E8B4B8;
            --soft-pink: #F7E7E6;
            --cream-white: #FFF8F3;
            --deep-rose: #C85A6F;
            --gold: #D4AF37;
            --text-dark: #333333;
            --text-light: #666666;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, var(--soft-pink), var(--cream-white));
            color: var(--text-dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 导航栏样式 */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            font-weight: 700;
            color: var(--deep-rose);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            list-style: none;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 500;
            transition: color 0.3s ease;
            position: relative;
        }

        .nav-link:hover {
            color: var(--deep-rose);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--deep-rose);
            transition: width 0.3s ease;
        }

        .nav-link:hover::after {
            width: 100%;
        }

        /* 移动端菜单按钮 */
        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: var(--text-dark);
            cursor: pointer;
        }

        /* 主要内容区域 */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 2rem 2rem;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--deep-rose);
            text-align: center;
            margin-bottom: 3rem;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease 0.5s forwards;
        }

        /* 留言表单样式 */
        .message-form {
            background: rgba(255, 255, 255, 0.9);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 3rem;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease 0.8s forwards;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-dark);
        }

        .form-input {
            width: 100%;
            padding: 1rem;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-pink);
            box-shadow: 0 0 0 3px rgba(232, 180, 184, 0.2);
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--primary-pink), var(--deep-rose));
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(200, 90, 111, 0.3);
            width: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(200, 90, 111, 0.4);
        }

        /* 留言列表样式 */
        .messages-list {
            display: grid;
            gap: 1.5rem;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeInUp 1s ease 1.1s forwards;
        }

        .message-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 1.5rem;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            border-left: 4px solid var(--primary-pink);
            transition: all 0.3s ease;
        }

        .message-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #eee;
        }

        .message-author {
            font-weight: 600;
            color: var(--deep-rose);
        }

        .message-time {
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .message-text {
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* 移动端导航菜单 */
        .mobile-nav {
            position: fixed;
            top: 0;
            right: -300px;
            width: 300px;
            height: 100vh;
            background: white;
            box-shadow: -5px 0 15px rgba(0, 0, 0, 0.1);
            transition: right 0.3s ease;
            z-index: 999;
            padding: 2rem;
        }

        .mobile-nav.active {
            right: 0;
        }

        .mobile-nav-links {
            list-style: none;
            margin-top: 3rem;
        }

        .mobile-nav-link {
            display: block;
            padding: 1rem 0;
            text-decoration: none;
            color: var(--text-dark);
            font-size: 1.2rem;
            border-bottom: 1px solid #eee;
            transition: color 0.3s ease;
        }

        .mobile-nav-link:hover {
            color: var(--deep-rose);
        }

        .close-menu {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-dark);
        }

        /* 动画定义 */
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .mobile-menu-btn {
                display: block;
            }

            .page-title {
                font-size: 2.5rem;
            }

            .navbar {
                padding: 1rem;
            }

            .logo {
                font-size: 1.5rem;
            }

            .container {
                padding: 80px 1rem 1rem;
            }
        }

        @media (max-width: 480px) {
            .page-title {
                font-size: 2rem;
            }

            .message-form {
                padding: 1.5rem;
            }

            .submit-btn {
                padding: 0.8rem 1.5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <a href="index.html" class="logo">My Love</a>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-link">首页</a></li>
            <li><a href="memories.html" class="nav-link">回忆相册</a></li>
            <li><a href="messages.html" class="nav-link">爱情留言</a></li>
        </ul>
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
            <i class="fas fa-bars"></i>
        </button>
    </nav>

    <!-- 移动端导航菜单 -->
    <div class="mobile-nav" id="mobileNav">
        <button class="close-menu" onclick="toggleMobileMenu()">
            <i class="fas fa-times"></i>
        </button>
        <ul class="mobile-nav-links">
            <li><a href="index.html" class="mobile-nav-link" onclick="toggleMobileMenu()">首页</a></li>
            <li><a href="memories.html" class="mobile-nav-link" onclick="toggleMobileMenu()">回忆相册</a></li>
            <li><a href="messages.html" class="mobile-nav-link" onclick="toggleMobileMenu()">爱情留言</a></li>
        </ul>
    </div>

    <!-- 主要内容 -->
    <div class="container">
        <h1 class="page-title">爱情留言板</h1>
        
        <!-- 留言表单 -->
        <form class="message-form" id="messageForm">
            <div class="form-group">
                <label for="name" class="form-label">你的名字</label>
                <input type="text" id="name" class="form-input" placeholder="请输入你的名字" required>
            </div>
            <div class="form-group">
                <label for="message" class="form-label">留言内容</label>
                <textarea id="message" class="form-input form-textarea" placeholder="写下你对她的生日祝福..." required></textarea>
            </div>
            <button type="submit" class="submit-btn">
                <i class="fas fa-heart"></i> 发送祝福
            </button>
        </form>

        <!-- 留言列表 -->
        <div class="messages-list" id="messagesList">
            <!-- 留言会动态添加到这里 -->
        </div>
    </div>

    <script>
        // 移动端菜单切换
        function toggleMobileMenu() {
            const mobileNav = document.getElementById('mobileNav');
            mobileNav.classList.toggle('active');
        }

        // 点击导航链接时关闭移动菜单
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', function() {
                const mobileNav = document.getElementById('mobileNav');
                mobileNav.classList.remove('active');
            });
        });

        // 表单提交处理
        document.getElementById('messageForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('name').value.trim();
            const message = document.getElementById('message').value.trim();
            
            if (!name || !message) {
                alert('请填写姓名和留言内容！');
                return;
            }
            
            // 创建新的留言卡片
            const messageCard = document.createElement('div');
            messageCard.className = 'message-card';
            messageCard.innerHTML = `
                <div class="message-header">
                    <span class="message-author">${name}</span>
                    <span class="message-time">${new Date().toLocaleString()}</span>
                </div>
                <div class="message-text">${message}</div>
            `;
            
            // 添加动画效果
            messageCard.style.opacity = '0';
            messageCard.style.transform = 'translateY(20px)';
            
            // 插入到留言列表顶部
            const messagesList = document.getElementById('messagesList');
            messagesList.insertBefore(messageCard, messagesList.firstChild);
            
            // 显示动画
            setTimeout(() => {
                messageCard.style.transition = 'all 0.5s ease';
                messageCard.style.opacity = '1';
                messageCard.style.transform = 'translateY(0)';
            }, 100);
            
            // 清空表单
            document.getElementById('messageForm').reset();
            
            // 显示成功提示
            const submitBtn = document.querySelector('#messageForm button');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = '留言成功！';
            submitBtn.style.background = 'linear-gradient(135deg, #4CAF50, #45a049)';
            
            setTimeout(() => {
                submitBtn.textContent = originalText;
                submitBtn.style.background = 'linear-gradient(135deg, #e8b4b8, #d4a5a5)';
            }, 2000);
        });

        // 页面加载动画
        window.addEventListener('load', function() {
            setTimeout(() => {
                document.body.style.opacity = '1';
            }, 100);
        });
    </script>
</body>
</html>
