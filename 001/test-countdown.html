<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倒计时测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f0f0f0;
        }
        .test-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: 10px 0;
        }
        .countdown {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        .info {
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>倒计时测试页面</h1>
    
    <div class="test-container">
        <h2>当前时间</h2>
        <div id="current-time" class="countdown"></div>
    </div>
    
    <div class="test-container">
        <h2>生日日期</h2>
        <div id="birthday-date" class="countdown"></div>
    </div>
    
    <div class="test-container">
        <h2>倒计时</h2>
        <div id="countdown" class="countdown"></div>
        <div class="info">距离2025年11月8日还有：</div>
    </div>
    
    <div class="test-container">
        <h2>调试信息</h2>
        <div id="debug-info" class="info"></div>
    </div>

    <script>
        // 设置生日日期：2025年11月8日
        const birthday = new Date(2025, 10, 8, 0, 0, 0);
        
        function updateTest() {
            const now = new Date();
            const distance = birthday.getTime() - now.getTime();
            
            // 显示当前时间
            document.getElementById('current-time').textContent = now.toString();
            
            // 显示生日日期
            document.getElementById('birthday-date').textContent = birthday.toString();
            
            // 计算倒计时
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);
            
            // 显示倒计时
            document.getElementById('countdown').textContent = 
                `${days}天 ${hours}小时 ${minutes}分钟 ${seconds}秒`;
            
            // 调试信息
            document.getElementById('debug-info').innerHTML = `
                <p>当前时间戳: ${now.getTime()}</p>
                <p>生日时间戳: ${birthday.getTime()}</p>
                <p>时间差(毫秒): ${distance}</p>
                <p>计算天数: ${days}</p>
                <p>生日日期对象: ${JSON.stringify({
                    year: birthday.getFullYear(),
                    month: birthday.getMonth(),
                    date: birthday.getDate(),
                    hours: birthday.getHours(),
                    minutes: birthday.getMinutes(),
                    seconds: birthday.getSeconds()
                })}</p>
            `;
        }
        
        // 每秒更新一次
        updateTest();
        setInterval(updateTest, 1000);
    </script>
</body>
</html>
